name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fail instead of updating uv.lock if it's out of date.
env:
  UV_LOCKED: "1"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run install:api
      - run: mise run check:api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run install:web --frozen-lockfile
      - run: mise run check:web
