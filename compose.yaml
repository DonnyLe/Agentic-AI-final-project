# Local Postgres for development, so local runs don't write to the Neon database.
# Start with `docker compose up -d`; app/.env.example has the matching DATABASE_URL.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kangaroo
      POSTGRES_PASSWORD: kangaroo
      POSTGRES_DB: kangaroo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kangaroo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
